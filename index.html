<style>:root{--bg:#eef3f8;--card:#ffffff;--tx:#101c28;--mut:#556577;--ac:#0b7a75;--bd:#cfd9e4;--stroke:#3b4e63;--glass:rgba(215,235,250,.32);--sh:0 6px 18px rgba(16,28,40,.06)}
[data-theme=dark]{--bg:#0a1017;--card:#131d27;--tx:#e8f1fa;--mut:#95a6b8;--ac:#2dd4bf;--bd:#253444;--stroke:#9fb5cc;--glass:rgba(155,198,230,.14);--sh:0 8px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
h1{font-size:1.15rem;margin:0}h3{margin:.2rem 0 .6rem}
.tools{display:flex;gap:8px;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
input,select{width:100%}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600;transition:transform .12s ease,filter .15s ease}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.warn{background:#c0392b}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 16px}
#tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}
#tabs button.on{background:var(--ac);color:#fff}
main{padding:0 16px 30px;max-width:1100px;margin:auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:12px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.preset-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:10px}
label{display:block;font-size:.9rem;color:var(--mut)}label>span{display:block;margin-bottom:3px}
.hint{color:var(--mut);font-size:.88rem;margin:.4rem 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.out,#mmOut{grid-column:1/-1;margin-top:8px}
.out b,#mmOut b{color:var(--ac)}
table{border-collapse:collapse;width:100%;direction:ltr;font-size:.92rem}
td,th{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:center}
#tubes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.tube{background:var(--card);border:2px solid var(--bd);border-radius:14px;text-align:center;cursor:pointer;padding:8px;box-shadow:var(--sh);transition:border-color .18s ease,box-shadow .18s ease}
.tube.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset,var(--sh)}
.tube svg{width:100%;max-width:162px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.14))}
.tube small{display:block;color:var(--mut)}
.log{border-inline-start:4px solid var(--ac);padding:5px 11px;margin:8px 0;background:var(--glass);border-radius:8px}
.eq{direction:ltr;text-align:left;font-family:"Cambria Math","Times New Roman",serif;font-size:1.02rem;margin-top:3px;word-break:break-word}
.b{fill:#ffffff;opacity:.88;animation:rise 2.1s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:.92}to{transform:translateY(-155px);opacity:0}}
.fl{animation:fl .26s ease-in-out infinite alternate;transform-origin:50px 282px}
@keyframes fl{to{transform:scale(1.16,.88)}}
@media(max-width:560px){#tubes{gap:6px}.tube{padding:4px}.preset-row{grid-template-columns:1fr}}
#subQ{margin-bottom:6px}
</style>

<body>
<header>
  <h1 data-ar="🧪 محاكي معمل الكيمياء" data-en="🧪 Chemistry Lab Simulator"></h1>
  <div class="tools">
    <label><span data-ar="الخانات العشرية" data-en="Decimals"></span>
      <select id="dec"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
    <button id="lang">EN</button>
    <button id="theme" title="Dark / Lab mode">🌙</button>
  </div>
</header>
<nav id="tabs">
  <button data-p="bench" class="on" data-ar="منضدة الأنابيب" data-en="Test-Tube Bench"></button>
  <button data-p="mm" data-ar="الكتلة المولية" data-en="Molar Mass"></button>
  <button data-p="prep" data-ar="تحضير المحاليل" data-en="Solution Prep"></button>
  <button data-p="dil" data-ar="التخفيف" data-en="Dilution"></button>
  <button data-p="tit" data-ar="المعايرة" data-en="Titration"></button>
</nav>
<main>
<section id="bench" class="on">
  <div id="tubes"></div>
  <div class="card ctl">
    <div class="preset-row">
      <label><span data-ar="⚡ تشغيل سريع للتجارب الأساسية والتأكيدية (كل المجموعات)" data-en="⚡ Quick-Run Basic & Confirmatory Tests (All Groups)"></span>
        <select id="preset"></select></label>
      <button id="bRunPreset" class="ghost" data-ar="▶️ نفّذ التجربة" data-en="▶️ Run Test"></button>
    </div>
    <label><span data-ar="المادة / الكاشف (للخلط اليدوي الحر)" data-en="Substance / Reagent (Manual Mixing)"></span><input id="subQ" type="search" autocomplete="off" spellcheck="false"><select id="sub"></select></label>
    <div id="look" class="hint"></div>
    <label><span data-ar="حجم المحلول المضاف" data-en="Solution volume"></span>
      <select id="vol"><option value="1">1 mL</option><option value="5">5 mL</option></select></label>
    <div class="btns">
      <button id="bSolid" data-ar="➕ أضف صلب" data-en="➕ Add solid"></button>
      <button id="bWater" data-ar="💧 أضف ماء (5 mL)" data-en="💧 Add water (5 mL)"></button>
      <button id="bSol" data-ar="🧴 أضف محلولاً" data-en="🧴 Add solution"></button>
      <button id="bHeat" data-ar="🔥 تسخين" data-en="🔥 Heat"></button>
      <button id="bUndo" class="ghost" data-ar="↩️ تراجع خطوة" data-en="↩️ Undo step"></button>
      <button id="bReset" class="warn" data-ar="↺ إعادة ضبط الأنبوبة" data-en="↺ Reset tube"></button>
    </div>
    <p class="hint" data-ar="يدعم جميع مجموعات الشقوق الحامضية والقاعدية (الأساسية والتأكيدية)، وسط التفاعل (حامضي / قاعدي / متعادل)، ذوبان الرواسب في الأحماض والأمونيا وهيدروكسيد الصوديوم، وأثر التسخين." data-en="Supports all acidic & basic radical groups (basic & confirmatory tests), reaction medium (acidic/alkaline/neutral), solubility in acids, ammonia & NaOH, and heating effects."></p>
  </div>

</section>

<section id="mm"><div class="card">
  <label><span data-ar="الصيغة الكيميائية" data-en="Chemical formula"></span>
  <input id="mmIn" value="CuSO4.5H2O" dir="ltr" spellcheck="false"></label>
  <p class="hint">CuSO4.5H2O · Ca3(PO4)2 · KMnO4 · Al2(SO4)3 · K4[Fe(CN)6]</p>
  <div id="mmOut"></div>
</div></section>

<section id="prep"><div class="card grid">
  <label><span data-ar="الصيغة" data-en="Formula"></span><input id="pF" value="NaOH" dir="ltr"></label>
  <label><span data-ar="النوع" data-en="Type"></span><select id="pT"><option value="M">M (Molarity)</option><option value="N">N (Normality)</option></select></label>
  <label><span data-ar="التركيز المطلوب" data-en="Target conc."></span><input id="pC" type="number" step="any" value="0.1"></label>
  <label><span data-ar="الحجم (mL)" data-en="Volume (mL)"></span><input id="pV" type="number" step="any" value="250"></label>
  <label><span data-ar="معامل التكافؤ n" data-en="Equivalence factor n"></span><input id="pN" type="number" step="any" value="1"></label>
  <label><span data-ar="النقاوة %" data-en="Purity %"></span><input id="pP" type="number" step="any" value="100"></label>
  <div id="pOut" class="out"></div>
</div></section>

<section id="dil"><div class="card grid">
  <p class="hint" data-ar="اترك خانة واحدة فارغة ليتم حسابها: M₁V₁ = M₂V₂" data-en="Leave exactly one field empty: M₁V₁ = M₂V₂"></p>
  <label>M₁<input id="d1" type="number" step="any"></label>
  <label>V₁ (mL)<input id="d2" type="number" step="any"></label>
  <label>M₂<input id="d3" type="number" step="any"></label>
  <label>V₂ (mL)<input id="d4" type="number" step="any"></label>
  <div id="dOut" class="out"></div>
</div></section>

<section id="tit"><div class="card grid">
  <p class="hint" data-ar="a A + b T → النواتج ، المحلول المجهول A والمعاير T" data-en="a A + b T → products; A = analyte, T = titrant"></p>
  <label><span data-ar="تركيز المعاير Cₜ (M)" data-en="Titrant conc. Cₜ (M)"></span><input id="t1" type="number" step="any" value="0.1"></label>
  <label><span data-ar="حجم المعاير عند نقطة النهاية (mL)" data-en="Titrant volume at endpoint (mL)"></span><input id="t2" type="number" step="any" value="22.5"></label>
  <label><span data-ar="حجم المجهول (mL)" data-en="Analyte volume (mL)"></span><input id="t3" type="number" step="any" value="25"></label>
  <label>a<input id="t4" type="number" step="any" value="1"></label>
  <label>b<input id="t5" type="number" step="any" value="1"></label>
  <label><span data-ar="الكتلة المولية للمجهول (اختياري، g/mol)" data-en="Analyte molar mass (optional, g/mol)"></span><input id="t6" type="number" step="any"></label>
  <div id="tOut" class="out"></div>
</div></section>
</main>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let lang=LS.get('lang','ar'),dec=+LS.get('dec',4),cur=0;
const L=(a,e)=>lang==='ar'?a:e;

/* ---------- Atomic weights (118 elements) ---------- */
const AW=Object.fromEntries('H:1.0080,He:4.0026,Li:6.94,Be:9.0122,B:10.81,C:12.011,N:14.007,O:15.999,F:18.9984,Ne:20.1797,Na:22.9898,Mg:24.305,Al:26.9815,Si:28.085,P:30.9738,S:32.06,Cl:35.45,Ar:39.948,K:39.0983,Ca:40.078,Sc:44.9559,Ti:47.867,V:50.9415,Cr:51.9961,Mn:54.9380,Fe:55.845,Co:58.9332,Ni:58.6934,Cu:63.546,Zn:65.38,Ga:69.723,Ge:72.630,As:74.9216,Se:78.971,Br:79.904,Kr:83.798,Rb:85.4678,Sr:87.62,Y:88.9058,Zr:91.224,Nb:92.9064,Mo:95.95,Tc:98,Ru:101.07,Rh:102.9055,Pd:106.42,Ag:107.8682,Cd:112.414,In:114.818,Sn:118.710,Sb:121.760,Te:127.60,I:126.9045,Xe:131.293,Cs:132.9055,Ba:137.327,La:138.9055,Ce:140.116,Pr:140.9077,Nd:144.242,Pm:145,Sm:150.36,Eu:151.964,Gd:157.25,Tb:158.9254,Dy:162.500,Ho:164.9303,Er:167.259,Tm:168.9342,Yb:173.045,Lu:174.9668,Hf:178.486,Ta:180.9479,W:183.84,Re:186.207,Os:190.23,Ir:192.217,Pt:195.084,Au:196.9666,Hg:200.592,Tl:204.38,Pb:207.2,Bi:208.9804,Po:209,At:210,Rn:222,Fr:223,Ra:226,Ac:227,Th:232.0377,Pa:231.0359,U:238.0289,Np:237,Pu:244,Am:243,Cm:247,Bk:247,Cf:251,Es:252,Fm:257,Md:258,No:259,Lr:266,Rf:267,Db:268,Sg:269,Bh:270,Hs:277,Mt:278,Ds:281,Rg:282,Cn:285,Nh:286,Fl:289,Mc:290,Lv:293,Ts:294,Og:294'.split(',').map(x=>{const[e,w]=x.split(':');return[e,+w]}));

/* Formula parser: (), [], hydrates (. · • *), leading coefficients */
function parse(str){
  const clean=str.replace(/\s+/g,'').replace(/[₀-₉]/g,c=>c.charCodeAt(0)-8320);
  if(!clean)throw Error(L('أدخل صيغة','Enter a formula'));
  let total={};
  for(const part of clean.split(/[.·•*]/)){
    if(!part)continue;
    const m=part.match(/^(\d+)(.*)$/),k=m?+m[1]:1,body=m?m[2]:part;
    let i=0;
    const grp=close=>{const a={};
      while(i<body.length){const ch=body[i];
        if(ch==='('||ch==='['){i++;const g=grp(ch==='('?')':']');const n=num();for(const e in g)a[e]=(a[e]||0)+g[e]*n}
        else if(ch===')'||ch===']'){if(ch!==close)throw Error('Bracket mismatch');i++;return a}
        else if(/[A-Z]/.test(ch)){let el=ch;i++;if(i<body.length&&/[a-z]/.test(body[i]))el+=body[i++];
          if(!(el in AW))throw Error(L('عنصر غير معروف: ','Unknown element: ')+el);a[el]=(a[el]||0)+num()}
        else throw Error(L('رمز غير صالح: ','Invalid symbol: ')+ch)}
      if(close)throw Error('Bracket mismatch');return a};
    const num=()=>{let s='';while(i<body.length&&/\d/.test(body[i]))s+=body[i++];return s?+s:1};
    const r=grp(null);for(const e in r)total[e]=(total[e]||0)+r[e]*k}
  return total;
}
const mass=a=>Object.entries(a).reduce((s,[e,n])=>s+AW[e]*n,0);
const fx=(x,d=dec)=>Number.isFinite(x)?x.toFixed(d):'—';
const F=f=>f.replace(/(?<=[A-Za-z)\]])(\d+)/g,'<sub>$1</sub>');
const SUBU=s=>s.replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]);

/* ---------- Ions & compounds (Acidic & Basic radicals + confirmatory reagents) ---------- */
const ION={Cu:['Cu',2],Fe3:['Fe',3],Fe2:['Fe',2],K:['K',1],Na:['Na',1],Ca:['Ca',2],Sr:['Sr',2],Ba:['Ba',2],Ag:['Ag',1],Pb:['Pb',2],Hg:['Hg',2],Bi:['Bi',3],Cd:['Cd',2],Mn:['Mn',2],Cr:['Cr',3],NH4:['NH4',1,1],H:['H',1],
 SO4:['SO4',2,1],SO3:['SO3',2,1],S2O3:['S2O3',2,1],NO2:['NO2',1,1],Cl:['Cl',1],NO3:['NO3',1,1],CO3:['CO3',2,1],OH:['OH',1,1],I:['I',1],MnO4:['MnO4',1,1],CrO4:['CrO4',2,1],Cr2O7:['Cr2O7',2,1],SCN:['SCN',1,1],FeCN6:['Fe(CN)6',4,1],Fe3CN6:['Fe(CN)6',3,1],Mg:['Mg',2],Al:['Al',3],Zn:['Zn',2],Ni:['Ni',2],Co:['Co',2],Br:['Br',1],S:['S',2],HCO3:['HCO3',1,1],PO4:['PO4',3,1],HPO4:['HPO4',2,1],AC:['CH3COO',1,1],OX:['C2O4',2,1]};
const CAT=new Set(['Mg','Al','Zn','Ni','Co','Cu','Fe3','Fe2','K','Na','Ca','Sr','Ba','Ag','Pb','Hg','Bi','Cd','Mn','Cr','NH4','H']);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const cnt=(c,a)=>{const g=gcd(ION[c][1],ION[a][1]);return[ION[a][1]/g,ION[c][1]/g]};
const part=(f,n,p)=>n===1?f:(p?`(${f})${n}`:f+n);
const cmp=(c,a)=>{if(c==='H'&&a==='AC')return'CH3COOH';if(c==='H'&&a==='OX')return'H2C2O4';const[x,y]=cnt(c,a);return part(ION[c][0],x,ION[c][2])+part(ION[a][0],y,ION[a][2])};
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
const iS=i=>SUBU(ION[i][0])+(ION[i][1]>1?SUP[ION[i][1]]:'')+(CAT.has(i)?'⁺':'⁻');
const ICOL=[['MnO4','#7d1599',.84],['Cr2O7','#eb7d09',.8],['CrO4','#f0cf11',.8],['Cu','#1e88e5',.7],['Fe3','#d4921e',.72],['Fe2','#9fd082',.62],['Ni','#3bb263',.65],['Co','#df568b',.64],['Cr','#48a96c',.64],['Mn','#f3b6d0',.56]];

const SBL=[
['Na2CO3','Na','CO3','كربونات الصوديوم [CO₃²⁻ / Na⁺]','Sodium carbonate [CO₃²⁻ / Na⁺]','#f4f4ef','مسحوق أبيض','white powder',''],
['KHCO3','K','HCO3','بيكربونات البوتاسيوم [HCO₃⁻ / K⁺]','Potassium bicarbonate [HCO₃⁻ / K⁺]','#f6f6f2','بلورات بيضاء','white crystals',''],
['NaHCO3','Na','HCO3','بيكربونات الصوديوم [HCO₃⁻ / Na⁺]','Sodium bicarbonate [HCO₃⁻ / Na⁺]','#f8f8f6','مسحوق أبيض','white powder',''],
['Na2SO3','Na','SO3','كبريتيت الصوديوم [SO₃²⁻ / Na⁺]','Sodium sulfite [SO₃²⁻ / Na⁺]','#f6f6f2','بلورات بيضاء','white crystals',''],
['Na2S2O3','Na','S2O3','ثيوكبريتات الصوديوم [S₂O₃²⁻ / Na⁺]','Sodium thiosulfate [S₂O₃²⁻ / Na⁺]','#f6f6f2','بلورات بيضاء','white crystals','·5H2O'],
['Na2S','Na','S','كبريتيد الصوديوم [S²⁻ / Na⁺]','Sodium sulfide [S²⁻ / Na⁺]','#f3eedd','بلورات بيضاء مصفرة (رائحة H₂S)','yellowish-white crystals (H₂S smell)','·9H2O'],
['NaNO2','Na','NO2','نيتريت الصوديوم [NO₂⁻ / Na⁺]','Sodium nitrite [NO₂⁻ / Na⁺]','#f4f1e2','بلورات بيضاء مصفرة','pale yellowish crystals',''],
['NaCl','Na','Cl','كلوريد الصوديوم [Cl⁻ / Na⁺]','Sodium chloride [Cl⁻ / Na⁺]','#f6f6f2','بلورات بيضاء','white crystals',''],
['KCl','K','Cl','كلوريد البوتاسيوم [Cl⁻ / K⁺]','Potassium chloride [Cl⁻ / K⁺]','#f6f6f2','بلورات بيضاء','white crystals',''],
['NaBr','Na','Br','بروميد الصوديوم [Br⁻ / Na⁺]','Sodium bromide [Br⁻ / Na⁺]','#f6f6f2','بلورات بيضاء','white crystals',''],

function balance(rf,pf){
  const R=rf.map(x=>parse(x)),P=pf.map(x=>parse(x)),n=R.length+P.length,els=new Set();
  [...R,...P].forEach(o=>Object.keys(o).forEach(e=>els.add(e)));
  let best=null,v=Array(n).fill(1);
  const ok=()=>{for(const e of els){let s=0;R.forEach((o,i)=>s+=(o[e]||0)*v[i]);P.forEach((o,i)=>s-=(o[e]||0)*v[R.length+i]);if(s)return false}return true};
  const rec=i=>{if(i===n){if(ok()){const s=v.reduce((a,b)=>a+b);if(!best||s<best[0])best=[s,[...v]]}return}
    for(let k=1;k<=6;k++){v[i]=k;rec(i+1)}};
  rec(0);return best?best[1]:Array(n).fill(1);
}

  return R.map((x,i)=>t(x,i)).join(' + ')+' → '+P.map((x,i)=>t(x,R.length+i)).join(' + ').replace(/ \+ $/,'')};

  if(!rc)t.ions.add(R.c);if(!ra)t.ions.add(R.a);t.subs.push(id);
  for(const r of RULES){if(r.ions.every(i=>t.ions.has(i))&&r.ions.some(i=>i===R.c||i===R.a)){const o=r.fn(t);if(o)res.push(o)}}
  if(!res.length){
    if(!hadSubs)pushLog(t,`أُضيف المحلول: ${name(id)}`,`Added solution: ${name(id)}`);
    else pushLog(t,`إضافة ${name(id)}: لا يحدث تفاعل مرئي (لا راسب ولا غاز ولا تغير لون). الأيونات تبقى في المحلول.`,`Adding ${name(id)}: no visible reaction (no precipitate, gas or color change). Ions stay in solution.`);
  }else res.forEach(r=>pushLog(t,`إضافة ${name(id)}: ${r[0]}`,`Adding ${name(id)}: ${r[1]}`,r[2]));
}

const HS={NaHCO3:['يتحلل ويتصاعد CO₂ وبخار ماء (يعكّر ماء الجير)','Decomposes releasing CO₂ and steam (limewater turns milky)','2NaHCO₃ → Na₂CO₃ + H₂O + CO₂↑',1],
KHCO3:['يتحلل بالحرارة ويتصاعد CO₂ وبخار ماء','Decomposes on heating releasing CO₂ and steam','2KHCO₃ → K₂CO₃ + H₂O + CO₂↑',1],
PbNO3:['يتصاعد غاز NO₂ بني محمر ويتبقى مسحوق أصفر PbO','Brown NO₂ fumes evolve; yellow PbO residue remains','2Pb(NO₃)₂ → 2PbO + 4NO₂↑ + O₂↑',1,'#e0b020'],
CuNO3:['ينطلق NO₂ بني ويتحول الصلب الأزرق إلى CuO أسود','Brown NO₂ evolves; blue solid turns to black CuO','2Cu(NO₃)₂ → 2CuO + 4NO₂↑ + O₂↑',1,'#1b1b1b'],
AgNO3:['ينصهر ثم يتحلل إلى فضة رمادية مع NO₂ بني (حرارة شديدة)','Melts then decomposes to grey silver with brown NO₂ (strong heating)','2AgNO₃ → 2Ag + 2NO₂↑ + O₂↑',1,'#8d8d8d'],
KNO3:['ينصهر ويتصاعد الأكسجين (يوقد عود ثقاب متوهج)','Melts and releases O₂ (relights a glowing splint)','2KNO₃ → 2KNO₂ + O₂↑',1],
NaNO3:['ينصهر ويتصاعد الأكسجين (يوقد عود ثقاب متوهج)','Melts and releases O₂ (relights a glowing splint)','2NaNO₃ → 2NaNO₂ + O₂↑',1],
FeSO4:['يفقد ماء التبلر (أبيض) ثم يتحلل إلى بني محمر مع SO₂ خانق','Loses water (white) then decomposes to reddish-brown Fe₂O₃ with choking SO₂','2FeSO₄ → Fe₂O₃ + SO₂↑ + SO₃↑',1,'#7a2f12'],
CoCl2:['يتحول من الوردي إلى الأزرق عند فقد الماء (يرجع وردياً بالرطوبة)','Pink → blue as water is lost (reverts to pink in moist air)','CoCl₂·6H₂O → CoCl₂ + 6H₂O↑',0,'#2f4fd0'],
NiSO4:['يتحول من الأخضر الزمردي إلى الأصفر عند فقد الماء','Emerald green → yellow as water is lost','NiSO₄·6H₂O → NiSO₄ + 6H₂O↑',0,'#d0c24c'],
NH42CO3:['تنطلق النشادر وCO₂ برائحة نفاذة ويتحلل الملح','Pungent NH₃ and CO₂ evolve as the salt decomposes','(NH₄)₂CO₃ → 2NH₃↑ + CO₂↑ + H₂O',1]};
const HP={'Cu|OH':['CuO','#1b1b1b','أسود','black','Cu(OH)₂ → CuO + H₂O'],'Fe3|OH':['Fe2O3','#7a2f12','بني محمر داكن','dark reddish-brown','2Fe(OH)₃ → Fe₂O₃ + 3H₂O'],
'Al|OH':['Al2O3','#f4f4f4','أبيض','white','2Al(OH)₃ → Al₂O₃ + 3H₂O'],'Mg|OH':['MgO','#f6f6f6','أبيض','white','Mg(OH)₂ → MgO + H₂O'],
'Zn|OH':['ZnO','#f2e9a0','أصفر وهو ساخن وأبيض بعد التبريد','yellow when hot, white when cold','Zn(OH)₂ → ZnO + H₂O'],'Ni|OH':['NiO','#4a6b4a','أخضر داكن','dark green','Ni(OH)₂ → NiO + H₂O'],
'Cu|CO3':['CuO','#1b1b1b','أسود','black','CuCO₃ → CuO + CO₂↑',1],'Zn|CO3':['ZnO','#f2e9a0','أصفر وهو ساخن وأبيض بعد التبريد','yellow when hot, white when cold','ZnCO₃ → ZnO + CO₂↑',1],
'Mg|CO3':['MgO','#f6f6f6','أبيض','white','MgCO₃ → MgO + CO₂↑',1],'Ag|SO3':['Ag','#2a2a2a','أسود (فضة فلزية)','black (metallic silver)','Ag₂SO₃ → 2Ag↓ + SO₂↑']};
function heat(t){
  t.heatUntil=Date.now()+2600;let done=false;
  if(t.solid==='CuSO4'){t.solidCol='#f4f4ee';pushLog(t,'يتحول الملح الأزرق إلى مسحوق أبيض (فقد ماء التبلر) مع بخار ماء على جدار الأنبوبة','Blue crystals turn to white powder (water of crystallisation lost); condensation on the tube wall','CuSO₄·5H₂O → CuSO₄ + 5H₂O↑');done=true}
  else if(t.solid==='KMnO4'){t.gasUntil=Date.now()+4000;pushLog(t,'يتحلل ويتصاعد الأكسجين (يوقد عود ثقاب متوهج)','Decomposes releasing O₂ (relights a glowing splint)','2KMnO₄ → K₂MnO₄ + MnO₂ + O₂↑');done=true}
  else if(t.solid==='NH4Cl'){pushLog(t,'يتصاعد بخار أبيض يتكثف على الجزء البارد (تسامي ظاهري)','White fumes condense on the cooler part (apparent sublimation)','NH₄Cl ⇌ NH₃ + HCl');done=true}
  else if(HS[t.solid]){const h=HS[t.solid];if(h[3])t.gasUntil=Date.now()+4000;if(h[4])t.solidCol=h[4];pushLog(t,h[0],h[1],h[2]);done=true}
  else if(t.solid==='Na2CO3'||t.solid==='NaCl'||t.solid==='Na2SO4'||t.solid==='NaNO3'){pushLog(t,'لا تغير مرئي عند التسخين الهادئ','No visible change on gentle heating');done=true}
  if(t.hco3Mg&&t.level>0){t.hco3Mg=false;t.ions.delete('Mg');t.ions.delete('HCO3');t.gasUntil=Date.now()+4000;addPpt(t,'Mg','CO3','#f5f5f5','أبيض (كربونات المغنيسيوم)','white (MgCO₃)','MgCO3');pushLog(t,'بالتسخين تتفكك بيكربونات المغنيسيوم ويتكون راسب أبيض من MgCO₃ مع تصاعد CO₂ (تأكيد HCO₃⁻)','On heating, soluble Mg(HCO₃)₂ decomposes giving white MgCO₃ precipitate and CO₂ (confirms HCO₃⁻)','Mg(HCO₃)₂ → MgCO₃↓ + H₂O + CO₂↑');done=true}
  if(t.fe3Ac&&t.level>0){t.fe3Ac=false;t.tint=null;addPpt(t,'Fe3','OH','#8b3a14','بني محمر (أسيتات الحديديك القاعدية)','reddish-brown (basic iron(III) acetate)','Fe(OH)2CH3COO');pushLog(t,'بالتسخين يزول اللون الأحمر الدموي ويتكون راسب بني محمر من أسيتات الحديديك القاعدية','On heating, blood-red color disappears forming reddish-brown basic iron(III) acetate precipitate','Fe(CH₃COO)₃ + 2H₂O → Fe(OH)₂(CH₃COO)↓ + 2CH₃COOH');done=true}
  if(t.nh3&&t.level>0){t.gasUntil=Date.now()+5000;t.nh3=false;pushLog(t,'تصاعد غاز النشادر ذو الرائحة النفاذة، ويزرق عباد الشمس الحمراء','Pungent NH₃ gas evolves; moist red litmus turns blue','NH₄⁺ + OH⁻ → NH₃↑ + H₂O');done=true}
  for(const p of t.ppts){const h=HP[p.c+'|'+p.a];if(!h)continue;
    p.hex=h[1];p.ar=h[2];p.en=h[3];p.f=h[0];p.a='O';p.dis=null;if(h[5])t.gasUntil=Date.now()+4000;
    pushLog(t,`يتحول الراسب إلى ${h[0]} (${h[2]})${h[5]?' مع تصاعد CO₂':''}`,`Precipitate turns into ${h[0]} (${h[3]})${h[5]?' with CO₂ evolution':''}`,h[4]);done=true}
  if(t.ppts.some(p=>p.c==='Pb'&&p.a==='Cl')){pushLog(t,'يذوب PbCl₂ الأبيض بالتسخين ويعود للترسب بلورات إبرية عند التبريد','White PbCl₂ dissolves on heating and recrystallises as needles on cooling');done=true}
  if(!done&&t.level>0)pushLog(t,'يسخن المحلول فقط دون تغير كيميائي ملحوظ','Solution just warms; no noticeable chemical change');
  else if(!done)pushLog(t,'الأنبوبة فارغة','The tube is empty');
}

function svg(t,i){
  const base=268,top=base-Math.min(t.level,22)*10,[lc,lo]=liq(t),now=Date.now();
  let s=`<svg viewBox="0 0 100 300"><defs>
    <clipPath id="c${i}"><path d="M22 14V240a28 28 0 0 0 56 0V14z"/></clipPath>
    <linearGradient id="gl${i}" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="76%" stop-color="#000000" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="lq${i}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${lc}" stop-opacity="${Math.min(lo+.12,.94)}"/>
      <stop offset="100%" stop-color="${lc}" stop-opacity="${lo}"/>
    </linearGradient>
  </defs><g clip-path="url(#c${i})">`;
  if(t.level>0){
    s+=`<rect x="0" y="${top}" width="100" height="${base-top+4}" fill="url(#lq${i})"/>`;
    s+=`<ellipse cx="50" cy="${top}" rx="28" ry="3.2" fill="#ffffff" opacity=".34"/>`;
  }
  t.ppts.slice(0,6).forEach((p,k)=>{const h=16,y=base-h*(k+1);s+=`<rect x="0" y="${y}" width="100" height="${h+2}" fill="${p.hex}" opacity=".97"/>`;
    for(let j=0;j<10;j++)s+=`<circle cx="${25+j*5.6}" cy="${y+3.5+((j*7+k*4)%10)}" r="1.75" fill="#ffffff" opacity=".28"/>`});
  if(t.solid){const c=t.solidCol||SB[t.solid].col;s+=`<path d="M27 ${base}Q50 ${base-36} 73 ${base}z" fill="${c}" stroke="#00000038" stroke-width="1.2"/>`}
  if(t.gasUntil>now)for(let j=0;j<10;j++)s+=`<circle class="b" cx="${29+j*5.2}" cy="${base-20}" r="${1.9+j%3}" style="animation-delay:${(j*.24).toFixed(2)}s"/>`;
  s+=`<rect x="20" y="12" width="60" height="260" fill="url(#gl${i})" pointer-events="none"/></g>`;
  s+=`<path d="M22 14V240a28 28 0 0 0 56 0V14" fill="var(--glass)" stroke="var(--stroke)" stroke-width="3"/><path d="M28 22V232" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity=".45"/><path d="M15 14H85" stroke="var(--stroke)" stroke-width="4.2" stroke-linecap="round"/>`;
  if(t.heatUntil>now)s+=`<g class="fl"><path d="M50 296C35 284 39 273 50 260C61 273 65 284 50 296Z" fill="#ff7b00"/><path d="M50 294C42 286 45 279 50 270C55 279 58 286 50 294Z" fill="#ffd84d"/></g>`;
  return s+'</svg>';
}
function drawTubes(){
  $('#tubes').innerHTML=tubes.map((t,i)=>`<div class="tube ${i===cur?'sel':''}" data-i="${i}">${svg(t,i)}<b>${L('أنبوبة','Tube')} ${i+1}</b><small>${t.solid?name(t.solid):''} ${t.level?t.level.toFixed(0)+' mL':''}</small></div>`).join('');
  $$('.tube').forEach(e=>e.onclick=()=>{cur=+e.dataset.i;drawTubes();drawLog()});
  const t=tubes[cur];
  $('#bUndo').disabled=!t.hist.length;
  $('#log').innerHTML=t.log.length?t.log.map(l=>`<div class="log">${L(l.ar,l.en)}${l.eq?`<div class="eq">${l.eq}</div>`:''}</div>`).join(''):`<p class="hint">${L('لا توجد ملاحظات بعد.','No observations yet.')}</p>`;
  const nx=Math.max(t.gasUntil,t.heatUntil)-Date.now();if(nx>0)setTimeout(drawTubes,Math.min(nx+60,1500));
}
const drawLog=()=>{};
const nz=s=>s.toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[\u064B-\u0652\s()·.\-_[\]]/g,'');
const LIQ=new Set(['H2S','HCl','H2SO4','H2SO4C','HNO3','HNO3C','NH3','NESSLER','AcOH','H3PO4','H2C2O4']);
function fillPresets(){
  const v=$('#preset').value;
  $('#preset').innerHTML=PRESETS.map(p=>`<option value="${p[0]}">${L(p[1],p[2])}</option>`).join('');
  if(v)$('#preset').value=v;
}
function fillSubs(){
  const q=nz($('#subQ').value||''),v=$('#sub').value;
  const hit=r=>!q||[r[0],SB[r[0]].f,r[3],r[4],r[8]||''].some(x=>nz(x).includes(q));
  const lab=r=>(r[0]==='CuSO4'?'CuSO₄·5H₂O':SUBU(SB[r[0]].f)+SUBU(r[8]||''))+' — '+L(r[3],r[4]);
  const grp=(g,f)=>{const l=SBL.filter(r=>f(r)&&hit(r));return l.length?`<optgroup label="${g}">${l.map(r=>`<option value="${r[0]}">${lab(r)}</option>`).join('')}</optgroup>`:''};
  $('#sub').innerHTML=grp(L('أملاح وقواعد وكواشف الشقوق (حامضية وقاعدية)','Salts, bases & radical reagents'),r=>!LIQ.has(r[0]))+grp(L('أحماض وكواشف المجموعات','Acids & group reagents'),r=>LIQ.has(r[0]));
  if(v&&[...$('#sub').options].some(o=>o.value===v))$('#sub').value=v;showLook();
}
function showLook(){const s=SB[$('#sub').value];if(!s){$('#look').textContent=L('لا نتائج مطابقة','No matches');$('#bSolid').disabled=true;$('#bSol').disabled=true;return}$('#bSol').disabled=false;$('#look').textContent=L('المظهر: ','Appearance: ')+L(s.lk[0],s.lk[1])+(s.hy?` (${SUBU(s.f)}${SUBU(s.hy)})`:'');$('#bSolid').disabled=!s.col}
function act(fn,record=true){const t=tubes[cur];try{const prev=record?snap(t):null;fn(t);if(record){t.hist.push(prev);if(t.hist.length>25)t.hist.shift()}}catch(e){alert(e.message)}save();drawTubes()}
$('#sub').onchange=showLook;$('#subQ').oninput=fillSubs;
$('#bRunPreset').onclick=()=>act(t=>{
  const p=PRESETS.find(x=>x[0]===$('#preset').value);if(!p)return;
  const keepHist=t.hist;Object.assign(t,newTube(),{hist:keepHist});
  pushLog(t,`▶ بدء تجربة: ${L(p[1],p[2])}`,`▶ Running test: ${p[2]}`);
  for(const st of p[3]){
    if(st[0]==='solid'){t.solid=st[1];t.solidCol=null;pushLog(t,`أُضيف صلب ${name(st[1])}`,`Added solid ${SB[st[1]].en}`)}
    else if(st[0]==='water'){if(t.solid){const n=t.solid;dissolve(t);t.level+=5;pushLog(t,`يذوب ${name(n)} في الماء`,`${SB[n].en} dissolves in water`)}else t.level+=5}
    else if(st[0]==='sol'){react(t,st[1],st[2]||1)}
    else if(st[0]==='heat'){heat(t)}
  }
});
$('#bSolid').onclick=()=>act(t=>{const id=$('#sub').value;if(!SB[id])return;
  if(t.level>0){react(t,id,0.3);return}
  if(t.solid&&t.solid!==id){alert(L('الأنبوبة تحتوي مادة صلبة أخرى؛ أعد الضبط أو أضف ماءً أولاً.','The tube already holds another solid; reset it or add water first.'));return}
  t.solid=id;t.solidCol=null;pushLog(t,`أُضيف ${name(id)} (${L(SB[id].lk[0],SB[id].lk[1])})`,`Added ${name(id)} (${SB[id].lk[1]})`)});
$('#bWater').onclick=()=>act(t=>{if(t.level+5>22){alert(L('الأنبوبة ممتلئة','Tube is full'));return}
  if(t.solid){const n=t.solid;dissolve(t);t.level+=5;pushLog(t,`يذوب ${name(n)} في الماء: ${t.ions.has('MnO4')?'محلول بنفسجي':'يتكون المحلول'}`,`${name(n)} dissolves in water, forming a solution`)}
  else{t.level+=5;pushLog(t,'أُضيف ماء مقطر','Distilled water added')}});
$('#bSol').onclick=()=>act(t=>{const v=+$('#vol').value;if(!SB[$('#sub').value])return;if(t.level+v>22){alert(L('الأنبوبة ممتلئة','Tube is full'));return}react(t,$('#sub').value,v)});
$('#bHeat').onclick=()=>act(heat);
$('#bUndo').onclick=()=>act(t=>{if(!t.hist.length)return;const prev=t.hist.pop();const keepHist=t.hist;restoreSnap(t,prev);t.hist=keepHist},false);
$('#bReset').onclick=()=>act(t=>{const keepHist=t.hist;Object.assign(t,newTube(),{hist:keepHist})});

function mmCalc(){
  const o=$('#mmOut');
  try{const a=parse($('#mmIn').value),M=mass(a);
    o.innerHTML=`<p><b>${L('الكتلة المولية','Molar mass')}: ${fx(M)} g/mol</b></p><table><tr><th>${L('العنصر','Element')}</th><th>n</th><th>Ar</th><th>${L('الكتلة','Mass')}</th><th>%</th></tr>`+
    Object.entries(a).map(([e,n])=>`<tr><td>${e}</td><td>${n}</td><td>${fx(AW[e])}</td><td>${fx(AW[e]*n)}</td><td>${fx(AW[e]*n/M*100,Math.min(dec,3))}</td></tr>`).join('')+'</table>'}
  catch(e){o.innerHTML=`<p style="color:#c0392b">${e.message}</p>`}
}
function prepCalc(){
  const o=$('#pOut');try{const M=mass(parse($('#pF').value)),C=+$('#pC').value,V=+$('#pV').value,n=+$('#pN').value||1,p=+$('#pP').value||100,N=$('#pT').value==='N';
    const g=C*V/1000*(N?M/n:M)/(p/100);
    o.innerHTML=`<p>${L('الكتلة المولية','Molar mass')}: ${fx(M)} g/mol${N?` · ${L('الوزن المكافئ','Equivalent weight')}: ${fx(M/n)} g/eq`:''}</p><p><b>${L('المطلوب وزنه','Mass to weigh')}: ${fx(g)} g</b> (${fx(g*1000,Math.max(dec-2,1))} mg)</p><p class="hint">${L('أذب في كمية قليلة من الماء ثم أكمل إلى العلامة','Dissolve in a little water, then make up to the mark')} ${V} mL.</p>`}
  catch(e){o.innerHTML=`<p style="color:#c0392b">${e.message}</p>`}
}
function dilCalc(){
  const ids=['d1','d2','d3','d4'],v=ids.map(i=>$('#'+i).value===''?null:+$('#'+i).value),e=v.filter(x=>x===null).length,o=$('#dOut');
  if(e!==1){o.innerHTML=`<p class="hint">${L('اترك خانة واحدة فقط فارغة','Leave exactly one field empty')}</p>`;return}
  if(v.some(x=>x!==null&&x<=0)){o.innerHTML=`<p style="color:#c0392b">${L('أدخل قيماً موجبة أكبر من الصفر','Enter positive values greater than zero')}</p>`;return}
  let[a,b,c,d]=v,r,lbl;
  if(a===null){r=c*d/b;lbl='M₁'}else if(b===null){r=c*d/a;lbl='V₁ (mL)'}else if(c===null){r=a*b/d;lbl='M₂'}else{r=a*b/c;lbl='V₂ (mL)'}
  o.innerHTML=`<p><b>${lbl} = ${fx(r)}</b></p>`+(b===null?`<p class="hint">${L('أضف ماءً بحجم','Add water volume')}: ${fx(d-r)} mL</p>`:'');
}
function titCalc(){
  const C=+$('#t1').value,Vt=+$('#t2').value,Va=+$('#t3').value,a=+$('#t4').value,b=+$('#t5').value,Mw=+$('#t6').value,o=$('#tOut');
  if(!Va||!b){o.innerHTML=`<p class="hint">${L('أدخل قيماً صحيحة','Enter valid values')}</p>`;return}
  const mmol=C*Vt*a/b,Ca=mmol/Va;
  o.innerHTML=`<p>${L('مللي مول المعاير','Titrant mmol')}: ${fx(C*Vt)} → ${L('مللي مول المجهول','Analyte mmol')}: ${fx(mmol)}</p><p><b>${L('تركيز المجهول','Analyte concentration')} = ${fx(Ca)} M</b></p>`+
   (Mw>0?`<p>${L('التركيز بالجرام/لتر','Concentration (g/L)')}: <b>${fx(Ca*Mw)} g/L</b></p>`:'');
}
['mmIn'].forEach(i=>$('#'+i).oninput=mmCalc);
['pF','pT','pC','pV','pN','pP'].forEach(i=>$('#'+i).oninput=prepCalc);
['d1','d2','d3','d4'].forEach(i=>$('#'+i).oninput=dilCalc);
['t1','t2','t3','t4','t5','t6'].forEach(i=>$('#'+i).oninput=titCalc);

$('#lang').onclick=()=>{lang=lang==='ar'?'en':'ar';LS.set('lang',lang);applyLang()};
$('#dec').value=dec;$('#dec').onchange=e=>{dec=+e.target.value;LS.set('dec',dec);mmCalc();prepCalc();dilCalc();titCalc()};
const setTheme=d=>{document.documentElement.dataset.theme=d?'dark':'light';$('#theme').textContent=d?'☀️':'🌙';LS.set('dark',d)};
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
setTheme(LS.get('dark',matchMedia('(prefers-color-scheme: dark)').matches));
$$('#tabs button').forEach(b=>b.onclick=()=>{$$('#tabs button,main>section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.p).classList.add('on')});
applyLang();
</script>
